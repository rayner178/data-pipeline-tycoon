name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tycoon
          POSTGRES_PASSWORD: tycoon_ci_password
          POSTGRES_DB: tycoon
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U tycoon -d tycoon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_USER: tycoon
      POSTGRES_PASSWORD: tycoon_ci_password
      POSTGRES_DB: tycoon
      DATABASE_URL: postgresql+psycopg://tycoon:tycoon_ci_password@localhost:5432/tycoon
      API_KEY: ci-test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy)
        run: uv run --frozen mypy

      - name: Run test suite (pytest)
        run: uv run --frozen pytest

      - name: Run E2E HTTP smoke test (Neon NOSUPERUSER simulation)
        run: uv run --frozen python scripts/smoke_test_e2e.py

  roblox-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Selene 0.27.1
        run: |
          mkdir -p "$RUNNER_TEMP/selene"
          curl -sSfL https://github.com/Kampfkarren/selene/releases/download/0.27.1/selene-0.27.1-linux.zip -o "$RUNNER_TEMP/selene.zip"
          unzip -q "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP/selene"
          chmod +x "$RUNNER_TEMP/selene/selene"
          echo "$RUNNER_TEMP/selene" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/selene/selene" --version

      - name: Generate Roblox standard library definition
        run: selene generate-roblox-std

      - name: Lint Luau scripts
        run: selene src/
