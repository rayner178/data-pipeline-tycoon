name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tycoon
          POSTGRES_PASSWORD: tycoon_ci_password
          POSTGRES_DB: tycoon
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U tycoon -d tycoon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_USER: tycoon
      POSTGRES_PASSWORD: tycoon_ci_password
      POSTGRES_DB: tycoon
      DATABASE_URL: postgresql+psycopg://tycoon:tycoon_ci_password@localhost:5432/tycoon
      API_KEY: ci-test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy)
        run: uv run --frozen mypy

      - name: Run test suite (pytest)
        run: uv run --frozen pytest
