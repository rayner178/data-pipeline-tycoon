[project]
name = "data-pipeline-tycoon"
version = "0.1.0"
description = "Plataforma de simulación gamificada para practicar ingeniería de datos (Monográfico UNICARIBE)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rayner Javier Rodriguez Brito" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# The code lives in top-level packages under src/ and is not installed;
# pytest and mypy resolve it through their path settings below.
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
